# Development Docker Infrastructure (Standalone)
# Usage: docker-compose -f docker-compose.dev.yml up -d

services:
  # PostgreSQL Database for local development
  postgres:
    image: postgres:16-alpine
    container_name: warung-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER:-warung}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-warung_secret}
      POSTGRES_DB: ${DB_NAME:-warung_db}
    ports:
      - '127.0.0.1:${DB_PORT:-5435}:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Redis Cache for local development
  redis:
    image: redis:7-alpine
    container_name: warung-redis-dev
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:${REDIS_PORT:-6381}:6379'
    volumes:
      - redis_data_dev:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data_dev:
  redis_data_dev:
