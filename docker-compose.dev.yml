version: '3.8'

# Development Docker Infrastructure (Standalone)
# Usage: docker-compose -f docker-compose.dev.yml up -d

services:
  # PostgreSQL Database for local development
  postgres:
    image: postgres:15-alpine
    container_name: warung-postgres-dev
    environment:
      POSTGRES_USER: warung
      POSTGRES_PASSWORD: warung_secret
      POSTGRES_DB: warung_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis Cache for local development
  redis:
    image: redis:5-alpine
    container_name: warung-redis-dev
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data_dev:/data
    restart: unless-stopped

volumes:
  postgres_data_dev:
  redis_data_dev:
