services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: warung-postgres
    environment:
      POSTGRES_USER: warung
      POSTGRES_PASSWORD: warung_secret
      POSTGRES_DB: warung_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U warung -d warung_db']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  # FIX CRASH STB: Gunakan Redis 5-alpine (Lebih stabil di kernel tua)
  redis:
    image: redis:5-alpine
    container_name: warung-redis
    command: redis-server --appendonly yes
    privileged: true # JURUS NUKLIR: Bypass semua limitasi kernel
    security_opt:
      - seccomp:unconfined
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    # Healthcheck bypass (biar gak bawel)
    # healthcheck:
    #   test: ["CMD", "redis-cli", "ping"]
    #   interval: 10s
    restart: unless-stopped

  # Minio Object Storage (DIHAPUS - Pakai Cloudflare R2)
  # minio: ... (Hemat RAM 200MB+)

  # WarungOS API
  api:
    image: warung-api:latest # Gunakan image hasil load manual / build
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile
    # build: ... (Jangan build di STB jika disk unstable)
    container_name: warung-api
    environment:
      - APP_ENV=production
      - LOG_LEVEL=info
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=warung
      - DB_PASSWORD=warung_secret
      - DB_NAME=warung_db
      - DB_SSL_MODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      # MINIO removed (Use R2_ variables in .env)
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started # Relaxed dependency because healthcheck is flaky on STB
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: warung-network
