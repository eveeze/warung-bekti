version: '3.8'

services:
  # PostgreSQL Database is now handled externally via Aiven Cloud
  # Local postgres container removed for STB deployment

  # Redis Cache
  # FIX CRASH STB: Gunakan Redis 5-alpine (Lebih stabil di kernel tua)
  redis:
    image: redis:5-alpine
    container_name: warung-redis
    command: redis-server --appendonly yes
    privileged: true # JURUS NUKLIR: Bypass semua limitasi kernel
    security_opt:
      - seccomp:unconfined
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    # Healthcheck bypass (biar gak bawel)
    # healthcheck:
    #   test: ["CMD", "redis-cli", "ping"]
    #   interval: 10s
    restart: unless-stopped

  # Minio Object Storage (DIHAPUS - Pakai Cloudflare R2)
  # minio: ... (Hemat RAM 200MB+)

  # WarungOS API
  api:
    image: warung-api:latest # Gunakan image hasil load manual / build
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile
    # build: ... (Jangan build di STB jika disk unstable)
    container_name: warung-api
    environment:
      - APP_ENV=production
      - LOG_LEVEL=info
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSL_MODE=${DB_SSL_MODE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      # MINIO removed (Use R2_ variables in .env)
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
    ports:
      - '8080:8080'
    depends_on:
      redis:
        condition: service_started # Relaxed dependency because healthcheck is flaky on STB
    restart: unless-stopped

volumes:
  redis_data:

networks:
  default:
    name: warung-network
